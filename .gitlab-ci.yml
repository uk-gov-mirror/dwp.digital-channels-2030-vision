image: node:24@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0

stages:
    - build
    - deploy

build:
    stage: build
    script:
        - npm ci
        - npm run build
    artifacts:
        paths:
            - _site
    only:
        - main

pages:
    stage: deploy
    dependencies:
        - build
    script:
        - rm -rf public
        - mv _site public
    artifacts:
        paths:
            - public
    only:
        - main